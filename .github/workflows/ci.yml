name: Build LaTeX document and upload PDF file
on: [push]
permissions:
    contents: write
jobs:
    build_latex:
        runs-on: ubuntu-latest
        steps:
            - name: Set up Git repository
              uses: actions/checkout@v7
            - name: Compile LaTeX document
              uses: xu-cheng/latex-action@v4
              with:
                  working_directory: talks/msfp26
                  root_file: msfp26-lists.tex
            - name: Upload PDF file
              uses: actions/upload-artifact@v7
              with:
                  name: msfp26-lists
                  path: talks/msfp26/msfp26-lists.pdf
                  overwrite: true
            - name: Release PDF file
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
              #uses: softprops/action-gh-release@v2
              with:
                  files: talks/msfp26/msfp26-lists.pdf
                  draft: true
