name: Build documents and upload PDF files
on: [push]
permissions:
    contents: write
jobs:
    discover_talks:
        runs-on: ubuntu-latest
        outputs:
            venues: ${{ steps.list.outputs.venues }}
        steps:
            - name: Set up Git repository
              uses: actions/checkout@v7
            - name: List talk venues
              id: list
              run: |
                  venues=$(ls -d talks/*/ | xargs -n1 basename | jq -R -s -c 'split("\n")[:-1]')
                  echo "venues=$venues" >> "$GITHUB_OUTPUT"

    discover_papers:
        runs-on: ubuntu-latest
        outputs:
            venues: ${{ steps.list.outputs.venues }}
        steps:
            - name: Set up Git repository
              uses: actions/checkout@v7
            - name: List paper venues
              id: list
              run: |
                  venues=$(ls -d papers/*/ | xargs -n1 basename | jq -R -s -c 'split("\n")[:-1]')
                  echo "venues=$venues" >> "$GITHUB_OUTPUT"

    build_talks:
        needs: discover_talks
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                venue: ${{ fromJson(needs.discover_talks.outputs.venues) }}
        steps:
            - name: Set up Git repository
              uses: actions/checkout@v7
            - name: Find abstract sources
              id: abstract_files
              working-directory: talks/${{ matrix.venue }}
              run: |
                  files=$(grep -l '^\\documentclass' *.tex 2>/dev/null || true)
                  echo "files<<EOF" >> "$GITHUB_OUTPUT"
                  echo "$files" >> "$GITHUB_OUTPUT"
                  echo "EOF" >> "$GITHUB_OUTPUT"
            - name: Compile abstract
              if: steps.abstract_files.outputs.files != ''
              uses: xu-cheng/latex-action@v4
              with:
                  working_directory: talks/${{ matrix.venue }}
                  root_file: ${{ steps.abstract_files.outputs.files }}
            - name: Upload abstract PDF
              if: steps.abstract_files.outputs.files != ''
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.venue }}-abstract
                  path: talks/${{ matrix.venue }}/*.pdf
                  overwrite: true
            - name: Find slides sources
              id: slides_files
              run: |
                  dir="talks/${{ matrix.venue }}/slides"
                  files=""
                  if [ -d "$dir" ]; then
                      files=$(find "$dir" -maxdepth 1 -name '*.typ' -printf '%f\n')
                  fi
                  echo "files<<EOF" >> "$GITHUB_OUTPUT"
                  echo "$files" >> "$GITHUB_OUTPUT"
                  echo "EOF" >> "$GITHUB_OUTPUT"
            - name: Set up Typst
              if: steps.slides_files.outputs.files != ''
              uses: typst-community/setup-typst@v4
            - name: Get Iosevka release tag
              if: steps.slides_files.outputs.files != ''
              id: iosevka_version
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tag=$(gh release view --repo be5invis/Iosevka --json tagName --jq .tagName)
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
            - name: Cache fonts
              if: steps.slides_files.outputs.files != ''
              id: font_cache
              uses: actions/cache@v4
              with:
                  path: /tmp/fonts
                  key: iosevka-font-${{ steps.iosevka_version.outputs.tag }}
            - name: Install fonts
              if: steps.slides_files.outputs.files != '' && steps.font_cache.outputs.cache-hit != 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  mkdir -p /tmp/fonts
                  gh release download --repo be5invis/Iosevka --pattern 'PkgTTC-Iosevka-*.zip' --dir /tmp/fonts --clobber
                  unzip -oq /tmp/fonts/PkgTTC-Iosevka-*.zip -d /tmp/fonts
            - name: Cache Typst packages
              if: steps.slides_files.outputs.files != ''
              uses: actions/cache@v4
              with:
                  path: ~/.cache/typst/packages
                  key: typst-packages-${{ hashFiles(format('talks/{0}/slides/*.typ', matrix.venue)) }}
            - name: Compile slides
              if: steps.slides_files.outputs.files != ''
              working-directory: talks/${{ matrix.venue }}/slides
              run: |
                  for f in ${{ steps.slides_files.outputs.files }}; do
                      typst compile --font-path /tmp/fonts "$f" "slides-${f%.typ}.pdf"
                  done
            - name: Upload slides PDF
              if: steps.slides_files.outputs.files != ''
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.venue }}-slides
                  path: talks/${{ matrix.venue }}/slides/*.pdf
                  overwrite: true

    build_papers:
        needs: discover_papers
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                venue: ${{ fromJson(needs.discover_papers.outputs.venues) }}
        steps:
            - name: Set up Git repository
              uses: actions/checkout@v7
            - name: Find paper sources
              id: paper_files
              working-directory: papers/${{ matrix.venue }}
              run: |
                  files=$(grep -l '^\\documentclass' *.tex 2>/dev/null || true)
                  echo "files<<EOF" >> "$GITHUB_OUTPUT"
                  echo "$files" >> "$GITHUB_OUTPUT"
                  echo "EOF" >> "$GITHUB_OUTPUT"
            - name: Compile paper
              if: steps.paper_files.outputs.files != ''
              uses: xu-cheng/latex-action@v4
              with:
                  working_directory: papers/${{ matrix.venue }}
                  root_file: ${{ steps.paper_files.outputs.files }}
            - name: Upload paper PDFs
              if: steps.paper_files.outputs.files != ''
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.venue }}-paper
                  path: papers/${{ matrix.venue }}/*.pdf
                  overwrite: true

    release:
        needs: [build_talks, build_papers]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Download PDF files
              uses: actions/download-artifact@v7
              continue-on-error: true
              with:
                  path: dist
                  merge-multiple: true
            - name: Check for PDF files
              id: check
              run: |
                  count=$(find dist -name '*.pdf' 2>/dev/null | wc -l)
                  echo "count=$count" >> "$GITHUB_OUTPUT"
            - name: Release PDF files
              if: steps.check.outputs.count != '0'
              uses: softprops/action-gh-release@v3.0.2
              with:
                  files: dist/*.pdf
                  draft: true
